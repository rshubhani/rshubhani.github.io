<!DOCTYPE html>
<html lang="en">
<head>
    <title>Installation Guide Sample</title>

    <!--Google Fonts for robot-->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: #555;
            line-height: 1.6;
            background-color: #f8f9fa;
            padding: 20px 0;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        h1 {
            color: #555;
            font-size: 2.2em;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .back-button {
            display: inline-block;
            background-color: #bda038;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-weight: 500;
            margin-bottom: 25px;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: #c73e02;
        }

        .coming-soon {
            text-align: center;
            padding: 60px 30px;
            background-color: #f8f9fa;
            border-radius: 10px;
            margin: 30px 0;
        }

        .coming-soon h2 {
            color: #555;
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .coming-soon p {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 20px;
        }

        .feature-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .coming-soon {
                padding: 40px 20px;
            }
            
            .coming-soon h2 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Back to Home</a>
        
        <h1>Installation Guide Sample</h1>
        
        <div class="coming-soon">
            <div class="feature-icon">🚀</div>
            <h2>Coming Soon!</h2>
            <p>I'm currently working on a comprehensive installation guide that will showcase my technical writing skills.</p>
            <p>This sample will demonstrate clear, step-by-step instructions for software installation and configuration.</p>
        </div>
    </div>
</body>
</html>
