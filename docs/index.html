<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shubhani Rawat | Technical Writer II Portfolio</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Bar with Quick Action Buttons */
    header {
      background-color: #0b1120;
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      z-index: 10;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-color);
    }

    .btn-outline:hover {
      background-color: var(--card-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Embedded Documentation Portal View */
    .portal-container {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Top Action Header -->
  <header>
    <div class="brand">
      <h1>Shubhani Rawat</h1>
      <p>Technical Writer II | Enterprise DLP & Docs-as-Code</p>
    </div>
    <div class="nav-actions">
      <a class="btn btn-primary" href="./Resume_Shubhani_Rawat.pdf" target="_blank">📄 Download Resume (PDF)</a>
      <a class="btn btn-outline" href="https://github.com/rshubhani/rshubhani.github.io" target="_blank">💻 GitHub</a>
      <a class="btn btn-outline" href="https://www.linkedin.com/in/shubhani-rawat/recent-activity/articles/" target="_blank">✍️ Published Articles</a>
      <a class="btn btn-outline" href="https://www.linkedin.com/in/shubhani-rawat/" target="_blank">💼 LinkedIn</a>
    </div>
  </header>

  <!-- Embedded WebHelp / Documentation Frame -->
  <div class="portal-container">
    <iframe src="./Output/index.html" title="Interactive Documentation Portal"></iframe>
  </div>

</body>
</html>
