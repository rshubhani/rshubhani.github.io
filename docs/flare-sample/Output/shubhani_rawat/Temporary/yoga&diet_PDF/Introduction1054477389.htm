        <h1 MadCap:xrefTargetName="What is Healthy Living$Q$"><a MadCap:generatedBookmark="TOC" name="What is Healthy Living$Q$"></a>What is Healthy Living?</h1>
        <p>Healthy living is a holistic approach that nurtures your body, mind, and spirit. It’s more than just exercise or diet; it includes emotional well-being, restful sleep, stress management, and mindful habits. Living healthily helps improve energy, mood, and longevity.</p>
