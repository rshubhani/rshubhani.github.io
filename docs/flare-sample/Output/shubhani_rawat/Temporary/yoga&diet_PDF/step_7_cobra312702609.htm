        <h5 MadCap:xrefTargetName="Step 7 - Cobra Pose"><a MadCap:generatedBookmark="TOC" name="Step 7 - Cobra Pose"></a>Step 7 - Cobra Pose</h5>
        <p><b>Sankskrit Name</b> - Bhujangasana </p>
        <p><b>Benefits</b> - Opens chest, strengthens spine, stimulates digestion.</p>
        <p>&#160;</p>
        <p style="font-weight: bold;">How to Practice</p>
        <ol>
            <li value="1">
                <p>Inhale, slide chest forward and lift torso.</p>
            </li>

                <p>Keep elbows bent, shoulders relaxed, and gaze upward.</p>
